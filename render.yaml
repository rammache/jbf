services:
  # Jabour Phone Full-Stack Web Service
  - type: web
    name: jabour-phone
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: frankfurt # Low latency to Lebanon/Middle East
    healthCheckPath: /health/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: SERVE_FRONTEND
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: jabour-phone-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render auto-generates 32+ character random secret
      - key: FRONTEND_URL
        sync: false # Set to your production domain or render.com URL
      - key: ADMIN_EMAIL
        value: jabour@jabourphone.com

databases:
  # Managed PostgreSQL Database
  - name: jabour-phone-db
    databaseName: jabour_phone_db
    user: postgres
    region: frankfurt
    plan: starter
    postgresMajorVersion: 16
