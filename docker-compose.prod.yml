version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jabour_phone_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: jabour_phone_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jabour_phone_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jabour_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jabour_phone_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/jabour_phone_db?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5000}
      SERVE_FRONTEND: "true"
      UPLOADS_DIR: /app/uploads
      ADMIN_EMAIL: ${ADMIN_EMAIL:-jabour@jabourphone.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Jabour}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"
    networks:
      - jabour_network

volumes:
  postgres_data:
    name: jabour_postgres_data
  uploads_data:
    name: jabour_uploads_data

networks:
  jabour_network:
    name: jabour_network
