name: CI - Jabour Phone Quality & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Typecheck, Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Lint and Typecheck
        run: npm run lint

      - name: Run automated test suite
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-secret-key-32-characters-long-minimum!

      - name: Build production bundle
        run: npm run build

  frontend:
    name: Frontend (Typecheck, Lint, Test, Build)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies (for test runner)
        working-directory: backend
        run: npm ci && npm run prisma:generate

      - name: Lint and Typecheck
        run: npm run lint

      - name: Run automated frontend tests
        run: npm test

      - name: Build production bundle
        run: npm run build
