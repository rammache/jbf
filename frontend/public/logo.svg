<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- Phone emblem icon -->
  <rect x="6" y="8" width="30" height="44" rx="6" stroke="#d10024" stroke-width="3" fill="#15161d"/>
  <rect x="10" y="14" width="22" height="30" rx="3" fill="#1e1f29"/>
  <!-- Screen camera notch / speaker -->
  <line x1="18" y1="11" x2="24" y2="11" stroke="#d10024" stroke-width="2" stroke-linecap="round"/>
  <!-- Home indicator / fingerprint -->
  <circle cx="21" cy="48" r="1.75" fill="#d10024"/>
  <!-- Signal wave / tech accent -->
  <path d="M42 20C44.5 22.5 44.5 26.5 42 29" stroke="#d10024" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M47 16C51.5 20.5 51.5 28.5 47 33" stroke="#d10024" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Typography -->
  <text x="60" y="38" font-family="'Montserrat', system-ui, sans-serif" font-size="26" font-weight="900" letter-spacing="-0.5" fill="currentColor">
    JABOUR
  </text>
  <text x="178" y="38" font-family="'Montserrat', system-ui, sans-serif" font-size="26" font-weight="900" letter-spacing="-0.5" fill="#d10024">
    PHONE
  </text>
  <circle cx="270" cy="36" r="3.5" fill="#d10024"/>
</svg>
